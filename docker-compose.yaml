# Worker stack: scheduler and Horizon.
#
# The web tier (Octane / FrankenPHP) is intentionally NOT here—it’s deployed as
# a standalone Coolify “Application” resource built from .docker/octane/Dockerfile
# so it gets health-gated rolling (zero-downtime) deploys, which Coolify does not
# perform for docker-compose resources. These workers don’t need zero-downtime.
#
# MySQL and Redis are managed separately as Coolify resources; these services
# reach them over Coolify’s predefined network.
services:
  scheduler:
    environment:
      LOG_FILE: scheduler
    build:
      context: .
      dockerfile: ./.docker/cli/Dockerfile
    command: [ "php", "artisan", "schedule:work" ]
    volumes:
      - ./storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'artisan schedule:work' | grep -v grep || exit 1"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
  horizon:
    build:
      context: .
      dockerfile: ./.docker/web/Dockerfile
    environment:
      PHP_FPM_POOL_NAME: "feed-canary_horizon"
      LOG_FILE: horizon
      # Set the same FEED_LOCAL_VALIDATOR_URL on the web Application so a manual
      # check behaves like a scheduled one. Both must resolve the validator over
      # Coolify’s predefined network. If it’s down, checks fall back to the public
      # validators and Sentry/Bugsink is alerted.
      FEED_LOCAL_VALIDATOR_URL: ${FEED_LOCAL_VALIDATOR_URL:-http://validator/check.cgi}
    command: [ "php", "artisan", "horizon" ]
    volumes:
      - ./storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep 'artisan horizon' | grep -v grep || exit 1"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 10s
  # Self-hosted W3C feed validator (check.cgi under Apache). Internal only: no
  # published port, no domain. Pinned to a commit; bump it deliberately.
  validator:
    build:
      context: https://github.com/w3c/feedvalidator.git#9ce274c9db93796b8ab2a44952b9da80811bf765
    restart: unless-stopped
    # Upstream Apache logs to files, which leaves Coolify’s log view empty. Send
    # them to stdout/stderr instead, then run Apache exactly as upstream does.
    command:
      - sh
      - -c
      - ln -sf /dev/stdout /var/log/apache2/access.log && ln -sf /dev/stderr /var/log/apache2/error.log && exec /usr/sbin/apache2ctl -D FOREGROUND
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/index.html', timeout=3)"]
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 5s
